version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
      - app2
      - app3

  app:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CLUSTER_URLS=redis://redis:6379/0
      - MAX_WORKERS=2
      - CACHE_TTL_SECONDS=3600
      - REVALIDATION_INTERVAL=300
    depends_on:
      - redis
    restart: always

  app2:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CLUSTER_URLS=redis://redis:6379/0
      - MAX_WORKERS=2
      - CACHE_TTL_SECONDS=3600
      - REVALIDATION_INTERVAL=300
    depends_on:
      - redis
    restart: always

  app3:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CLUSTER_URLS=redis://redis:6379/0
      - MAX_WORKERS=2
      - CACHE_TTL_SECONDS=3600
      - REVALIDATION_INTERVAL=300
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru

  redis-replica:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-replica-data:/data
    command: redis-server --replicaof redis 6379 --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru

  redis-sentinel:
    image: redis:alpine
    ports:
      - "26379:26379"
    volumes:
      - ./sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis
      - redis-replica

  celery-worker:
    build: .
    command: celery -A tasks worker --loglevel=info -Q nlp_queue,route_queue,geo_queue --concurrency=4
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  celery-worker2:
    build: .
    command: celery -A tasks worker --loglevel=info -Q nlp_queue,route_queue,geo_queue --concurrency=4
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  celery-beat:
    build: .
    command: celery -A tasks beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

volumes:
  redis-data:
  redis-replica-data: