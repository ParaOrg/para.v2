<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para PH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Prevent pull-to-refresh on mobile for a native app feel */
        body { overscroll-behavior-y: none; }
    </style>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden m-0 p-0">
    <div id="root" class="w-full h-full relative"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [messages, setMessages] = useState([
                { sender: 'bot', text: 'Kumusta! Saan tayo papunta? (e.g., "From Cubao to Ayala")' }
            ]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const routeLayerRef = useRef(null);
            const chatEndRef = useRef(null);

            // Initialize Map
            useEffect(() => {
                if (!mapInstanceRef.current) {
                    // Default to Manila
                    mapInstanceRef.current = L.map('map', { zoomControl: false }).setView([14.5995, 120.9842], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap'
                    }).addTo(mapInstanceRef.current);
                    
                    // Move zoom control to bottom right so it doesn't overlap chat
                    L.control.zoom({ position: 'bottomright' }).addTo(mapInstanceRef.current);
                }
            }, []);

            // Auto-scroll chat to bottom
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const drawRoute = (routeData) => {
                if (routeLayerRef.current) {
                    mapInstanceRef.current.removeLayer(routeLayerRef.current);
                }
                
                const latlngs = [];
                routeData.steps.forEach(step => {
                    step.geometry.forEach(coord => {
                        latlngs.push([coord[1], coord[0]]); // Leaflet uses [lat, lng]
                    });
                });

                if (latlngs.length > 0) {
                    routeLayerRef.current = L.polyline(latlngs, { color: '#2563eb', weight: 6, opacity: 0.8 }).addTo(mapInstanceRef.current);
                    mapInstanceRef.current.fitBounds(routeLayerRef.current.getBounds(), { padding: [50, 50] });
                }
            };

            const sendMessage = async () => {
                if (!input.trim()) return;
                
                const userMsg = { sender: 'user', text: input };
                setMessages(prev => [...prev, userMsg]);
                setInput('');
                setIsLoading(true);

                try {
                    // STRICT RULE: Frontend Fetch Safety. Read as text ONCE, then parse.
                    const res = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: 'demo_user', message: input })
                    });
                    
                    const textData = await res.text();
                    const data = JSON.parse(textData);

                    const botMsg = { sender: 'bot', text: data.reply_text };
                    setMessages(prev => [...prev, botMsg]);

                    if (data.route_data && data.route_data.success) {
                        drawRoute(data.route_data);
                    }
                } catch (error) {
                    console.error("Fetch error:", error);
                    setMessages(prev => [...prev, { sender: 'bot', text: 'May error sa server. Pakisubukan ulit.' }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <>
                    {/* Full Screen Map Background */}
                    <div id="map" className="absolute inset-0 z-0"></div>

                    {/* Floating Chat Overlay */}
                    <div className="absolute bottom-4 left-4 right-4 md:right-auto md:w-96 z-10 flex flex-col max-h-[70vh] bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-gray-200 overflow-hidden">
                        
                        {/* Header */}
                        <div className="bg-blue-600 text-white p-3 font-bold text-sm md:text-base flex items-center gap-2 shadow-sm">
                            <span>🚐</span> Para PH
                        </div>
                        
                        {/* Messages Area */}
                        <div className="flex-1 overflow-y-auto p-3 space-y-3 min-h-[200px] max-h-[40vh]">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[85%] p-3 rounded-2xl text-sm leading-relaxed ${
                                        msg.sender === 'user' 
                                            ? 'bg-blue-600 text-white rounded-br-none' 
                                            : 'bg-gray-100 text-gray-800 rounded-bl-none border border-gray-200'
                                    }`}>
                                        {msg.text}
                                    </div>
                                </div>
                            ))}
                            {isLoading && (
                                <div className="flex justify-start">
                                    <div className="bg-gray-100 text-gray-500 p-3 rounded-2xl rounded-bl-none text-sm italic border border-gray-200">
                                        Naghahanap ng ruta...
                                    </div>
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>

                        {/* Input Area */}
                        <div className="p-3 border-t border-gray-200 bg-white flex gap-2">
                            <input 
                                type="text" 
                                value={input} 
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && sendMessage()}
                                placeholder="Saan papunta?"
                                className="flex-1 bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            />
                            <button 
                                onClick={sendMessage} 
                                disabled={isLoading}
                                className="bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors font-medium text-sm"
                            >
                                Send
                            </button>
                        </div>
                    </div>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
