name: Scrape PAGASA Advisories

on:
  schedule:
    - cron: '0 22 * * *'  # 6 AM PHT (10 PM UTC)
  workflow_dispatch:

permissions:
  contents: write  # Required for git push from the workflow

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy branch (full history)
        uses: actions/checkout@v4
        with:
          ref: deploy
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python3 scripts/scrape_pagasa.py

      - name: Commit and push updated advisories
        run: |
          git config user.name "PAGASA Bot"
          git config user.email "bot@para.ph"
          git add src/utils/pagasaAdvisories.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: auto-update PAGASA advisories [skip ci]"

          # Retry push up to 3 times (handles concurrent pushes)
          for i in 1 2 3; do
            git pull --rebase origin deploy && git push origin HEAD:deploy && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
