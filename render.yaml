services:
  - type: web
    name: para-ph-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        value: redis://localhost:6379/0
